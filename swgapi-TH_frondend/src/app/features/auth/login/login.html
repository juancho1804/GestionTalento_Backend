<div class="login-root">
  <div class="login-card">
    <!-- Izquierda: imagen y logo -->
    <div class="login-img-side">
      <img class="img-campus" src="" alt="Campus Unicauca">
      <img class="logo-uni" src="./../../../../../public/Logo.png" alt="Logo Unicauca">
    </div>
    <!-- Derecha: formulario -->
    <div class="login-form-side">
      <h2>Bienvenido de nuevo</h2>
      <p>Ingrese sus credenciales para iniciar sesión.</p>
      <form [formGroup]="form" (ngSubmit)="ingresar()">
        <mat-form-field class="w100">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" autocomplete="off" />
        </mat-form-field>
        <mat-form-field class="w100">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="off" />
          <button mat-icon-button matSuffix type="button" (click)="showPassword=!showPassword">
            <mat-icon>{{showPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>
        <div class="login-row">
          <mat-checkbox>Recordar</mat-checkbox>
          <a class="forgot-link" href="#">¿Olvido la contraseña?</a>
        </div>
        <button type="submit" mat-flat-button color="primary" class="w100" [disabled]="form.invalid">Login</button>
      </form>
    </div>
  </div>
</div>
<footer class="login-footer">
  © 2024 Universidad del Cauca - Todos los derechos reservados
</footer>
