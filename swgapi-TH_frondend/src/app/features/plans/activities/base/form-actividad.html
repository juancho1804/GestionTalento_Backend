<div class="crear-bg">
  <div class="encabezado">
   
    </div>

    <mat-card class="card-formulario">
      <mat-card-content>
        <div class="encabezado-form">
          <mat-icon fontIcon="menu_book"></mat-icon>
          <h3 class="titulo-formulario">Crear Actividad de Capacitación</h3>
        </div>

        <p class="subtitulo-formulario">
          Complete todos los campos marcados con (<span style="color: #F1B434">*</span>) para registrar una nueva actividad de capacitación.
        </p>

        <form [formGroup]="actividadForm" (ngSubmit)="onSubmit()" class="actividad-form">

          <div class="campo-formulario">
            <label class="label-campo" for="nombreActividad">
              Nombre de la actividad <span style="color: #F1B434;">*</span>
            </label>
            <mat-form-field appearance="outline">
              <input matInput placeholder="Ingrese la actividad" required formControlName="nombre">
            </mat-form-field>
          </div>

          <div class="row-grid">
            <div>
              <label class="label-campo" for="fecha">
                <mat-icon color="primary" class="icono-label">event</mat-icon>
                Fecha <span style="color: #F1B434;">*</span>
              </label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput id="fecha" [matDatepicker]="pickerFecha" placeholder="dd/mm/aaaa" required formControlName="fecha">
                <mat-datepicker-toggle matSuffix [for]="pickerFecha"></mat-datepicker-toggle>
                <mat-datepicker #pickerFecha></mat-datepicker>
              </mat-form-field>
            </div>
          </div>

          <div class="row-grid">
            <div>
              <label class="label-campo" for="responsable">
                <mat-icon color="primary" class="icono-label">person</mat-icon>
                Responsable o encargado <span style="color: #F1B434;">*</span>
              </label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput id="responsable" placeholder="Nombre del responsable" required formControlName="responsable">
              </mat-form-field>
            </div>
            <div>
              <label class="label-campo" for="lugar">
                <mat-icon color="primary" class="icono-label">place</mat-icon>
                Lugar <span style="color: #F1B434;">*</span>
              </label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput id="lugar" placeholder="Ubicación de la actividad" required formControlName="lugar">
              </mat-form-field>
            </div>
          </div>

          <div class="row-grid">
            <div>
              <label class="label-campo" for="asignado">
                <mat-icon color="primary" class="icono-label">attach_money</mat-icon>
                Presupuesto Planeado <span style="color: #F1B434;">*</span>
              </label>
              <mat-form-field appearance="outline" class="w-100">
                <input matInput id="asignado" type="number" min="0" placeholder="$0" required formControlName="asignado">
              </mat-form-field>
            </div>
          </div>

          <!-- Campos extra por tipo de plan aquí con *ngIf -->
          
          <div class="acciones-formulario">
            <button mat-flat-button color="primary" type="submit" class="btn-guardar" [disabled]="actividadForm.invalid">
              Registrar Actividad
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
</div>
