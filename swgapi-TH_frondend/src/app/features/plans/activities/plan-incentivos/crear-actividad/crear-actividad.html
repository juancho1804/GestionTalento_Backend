<div class="crear-bg">
  <div class="actividad-container">
    <div class="actividad-header">
      <button mat-button class="btn-volver" type="button" (click)="volver()">
        <mat-icon>arrow_back</mat-icon>
        Volver al plan
      </button>
      <h2 class="actividad-titulo">Crear Actividad - Plan Incentivos</h2>
      <h3 class="titulo-plan">Plan de Incentivos</h3>
    </div>
    <app-form-actividad
      [actividadForm]="form"
      (formSubmit)="handleFormSubmit($event)"
    ></app-form-actividad>
  </div>
</div>
